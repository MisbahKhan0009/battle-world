[package]
name = "flag-clash"
version = "1.0.0"
description = "Flag Clash: renders viral game videos and posts them to YouTube on a schedule"
authors = ["Flag Clash contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flag_clash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["net", "io-util", "time", "fs", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
