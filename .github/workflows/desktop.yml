name: Windows app

# Builds the Windows installer (.exe). Every push to main uploads it as a workflow artifact;
# pushing a v* tag also creates a draft GitHub release with the installer attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Flag Clash ${{ github.ref_name }}'
          releaseBody: 'Download the Windows installer below. See the README for setup.'
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: flag-clash-windows
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe
